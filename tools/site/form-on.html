<form class="form" id="on" name="verkauf-anfrage" method="POST" action="/danke.html" data-netlify="true" netlify-honeypot="hp-firma">
          <input type="hidden" name="form-name" value="verkauf-anfrage"><input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign"><input type="hidden" name="utm_term"><input type="hidden" name="utm_content"><input type="hidden" name="referrer">
          <p class="hp" aria-hidden="true"><label>Firma <input name="hp-firma" tabindex="-1" autocomplete="off"></label></p>
          <div class="f f--full"><label for="on-name">Name <span class="req">*</span></label><input id="on-name" name="name" type="text" required autocomplete="name" placeholder="Vor- und Nachname"></div>
          <div class="f"><label for="on-email">E-Mail <span class="req">*</span></label><input id="on-email" name="email" type="email" required autocomplete="email" placeholder="ihr@beispiel.de"></div>
          <div class="f"><label for="on-telefon">Telefon</label><input id="on-telefon" name="telefon" type="tel" autocomplete="tel" placeholder="Optional"></div>
          <div class="f f--full"><label for="on-objektart">Was möchten Sie verkaufen?</label><select id="on-objektart" name="objektart"><option value="wohnung">Wohnung</option><option value="haus">Haus</option><option value="grundstueck">Grundstück</option><option value="sonstiges">Etwas anderes</option></select></div>
          <div class="f f--full"><label for="on-lage">Lage / PLZ</label><input id="on-lage" name="lage" type="text" placeholder="z. B. Neukölln / 12043 (optional)"></div>
          <div class="f f--full"><label for="on-nachricht">Nachricht</label><textarea id="on-nachricht" name="nachricht" rows="4" placeholder="Ihr Anliegen (optional)"></textarea></div>
          {{form-foot}}
          <button class="btn btn--gold btn--wide" type="submit">Beratung anfragen</button>
          <p class="form-req"><span class="req">*</span> Pflichtfeld</p>
          <p class="form-note form-note--c"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 10V8a6 6 0 1112 0v2M5 10h14v10H5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> Kostenlos · unverbindlich · kein Newsletter</p>
          <p class="form-err" role="alert" hidden>Ihre Anfrage wurde nicht gesendet. Bitte versuchen Sie es erneut oder rufen Sie uns an: <a href="tel:+493045032807">030 / 45032807</a>.</p>
        </form>
