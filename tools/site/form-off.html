<form class="form" id="off" name="offmarket-gespraech" method="POST" action="/danke.html" data-netlify="true" netlify-honeypot="hp-firma">
          <input type="hidden" name="form-name" value="offmarket-gespraech"><input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign"><input type="hidden" name="utm_term"><input type="hidden" name="utm_content"><input type="hidden" name="referrer">
          <p class="hp" aria-hidden="true"><label>Firma <input name="hp-firma" tabindex="-1" autocomplete="off"></label></p>
          <div class="f f--full"><label for="off-name">Name <span class="req">*</span></label><input id="off-name" name="name" type="text" required autocomplete="name" placeholder="Vor- und Nachname"></div>
          <div class="f"><label for="off-email">E-Mail <span class="req">*</span></label><input id="off-email" name="email" type="email" required autocomplete="email" placeholder="ihr@beispiel.de"></div>
          <div class="f"><label for="off-telefon">Telefon</label><input id="off-telefon" name="telefon" type="tel" autocomplete="tel" placeholder="Optional"></div>
          <div class="f f--full"><label for="off-objektart">Um welches Objekt geht es?</label><select id="off-objektart" name="objektart"><option value="Mehrfamilienhaus">Mehrfamilienhaus</option><option value="Einfamilienhaus">Einfamilienhaus</option><option value="Grundstück / Projektentwicklung">Grundstück / Projektentwicklung</option><option value="Gewerbeimmobilie">Gewerbeimmobilie</option><option value="Büro">Büro</option><option value="Hotel">Hotel</option><option value="Logistik">Logistik</option><option value="Sonstiges">Etwas anderes</option></select></div>
          <div class="f f--full"><label for="off-nachricht">Nachricht</label><textarea id="off-nachricht" name="nachricht" rows="4" placeholder="Ihr Anliegen (optional)"></textarea></div>
          {{form-foot}}
          <button class="btn btn--gold btn--wide" type="submit">Anfrage senden</button>
          <p class="form-req"><span class="req">*</span> Pflichtfeld</p>
          <p class="form-note form-note--c"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 10V8a6 6 0 1112 0v2M5 10h14v10H5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg> Vertraulich · unverbindlich · kein Newsletter</p>
          <p class="form-err" role="alert" hidden>Ihre Anfrage wurde nicht gesendet. Bitte versuchen Sie es erneut oder rufen Sie uns an: <a href="tel:+493045032807">030 / 45032807</a>.</p>
        </form>
